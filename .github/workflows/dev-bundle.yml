name: Dev bundle

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to build
        required: true

permissions:
  contents: read

jobs:
  bundle:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Localization keys
        run: ./Scripts/check-localization.sh
      - name: Build
        run: swift build -Xswiftc -swift-version -Xswiftc 6
      - name: Tests
        run: swift test -Xswiftc -swift-version -Xswiftc 6
      - name: Assemble app
        run: ./Scripts/bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Pulse-dev-${{ github.run_id }}
          path: build.noindex/Pulse.app
          retention-days: 1
          if-no-files-found: error
